<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Card</title>
  <style>
    body {
      background-color: #0f0f0f;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .video-card {
      display: flex;
      max-width: 800px;
      gap: 16px;
    }

    .thumbnail-wrapper {
      position: relative;
      width: 246px;
    }

    .thumbnail-wrapper img {
      width: 100%;
      border-radius: 10px;
    }

    .duration {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background-color: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 2px 6px;
      font-size: 12px;
      border-radius: 4px;
    }

    .video-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .video-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 6px;
    }

   .video-meta {
  font-size: 14px;
  color: #aaa;
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.channel-name {
  color: #aaa;
}

.view-count {
  color: #aaa;
}

.upload-time {
  color: #aaa;
}

.separator {
  margin: 0 4px;
}

  </style>
</head>
<body>
<div class="video-card">
  <div class="thumbnail-wrapper">
    <img src="https://i.ytimg.com/vi/mCx5aSEK8YE/hqdefault.jpg" alt="Video thumbnail" id="image">
    <span class="duration">31:20</span>
  </div>
  <div class="video-info">
    <div class="video-title">
      Installing VS Code & How Websites Work | Sigma Web Development Course - Tutorial #1
    </div>
    <div class="video-meta">
      <span class="channel-name">CodeWithHarry</span>
      <span class="separator">•</span>
      <span class="view-count">727K views</span>
      <span class="separator">•</span>
      <span class="upload-time">2 months ago</span>
    </div>
  </div>
</div>
<script src="script.js"></script>

</body>
</html>
